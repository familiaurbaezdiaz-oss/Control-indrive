<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Diario InDrive - Jefe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-p-4 pb-12">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- Encabezado -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">Control Diario InDrive</h1>
            <p class="text-xs text-slate-400 mt-1">Panel sincronizado con Google Sheets</p>
        </header>

        <!-- Tarjetas de Resumen Acumulado (Sincronizadas con Google Sheets) -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400">Hecho</span>
                <span id="accHecho" class="text-sm sm:text-base font-bold text-emerald-400">Cargando...</span>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400">Gastos</span>
                <span id="accGastos" class="text-sm sm:text-base font-bold text-rose-400">Cargando...</span>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <span class="block text-[10px] uppercase tracking-wider text-slate-400">Ganancia</span>
                <span id="accGanancia" class="text-sm sm:text-base font-bold text-amber-400">Cargando...</span>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl mb-6">
            <h2 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider">Nuevo Registro Diario</h2>
            
            <form id="registroForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fecha</label>
                    <input type="date" id="fecha" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Sección: Agregar / Restar Viajes Rápido -->
                <div class="bg-slate-900/70 p-3 rounded-xl border border-amber-500/30">
                    <label class="block text-xs font-medium text-amber-300 mb-1">Monto de viaje individual</label>
                    <div class="flex items-center gap-1.5">
                        <input type="number" step="any" id="viajeInput" placeholder="Ej. 250" class="w-full min-w-0 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                        <button type="button" id="btnSumarViaje" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-2 rounded-lg text-base transition duration-200 cursor-pointer shadow-md shrink-0">+</button>
                        <button type="button" id="btnRestarViaje" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3.5 py-2 rounded-lg text-base transition duration-200 cursor-pointer shadow-md shrink-0">-</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-amber-300 mb-1">Monto hecho en InDrive (RD$)</label>
                    <input type="number" step="any" id="montoHecho" placeholder="0.00" required class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-amber-300 font-semibold focus:outline-none focus:border-amber-400">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Combustible Hoy</label>
                        <input type="number" step="any" id="combustibleHoy" placeholder="0.00" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Recarga InDrive Hoy</label>
                        <input type="number" step="any" id="recargaHoy" placeholder="0.00" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Combustible Mañana</label>
                        <input type="number" step="any" id="combustibleManana" placeholder="0.00" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-300 mb-1">Recarga InDrive Mañana</label>
                        <input type="number" step="any" id="recargaManana" placeholder="0.00" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-amber-300 mb-1">Otros Gastos</label>
                    <input type="number" step="any" id="otrosGastos" placeholder="0.00" class="w-full bg-slate-900 border border-amber-500/50 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Vista Previa de Cálculos -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center text-xs">
                    <div>
                        <span class="text-slate-400">Total Gastos: </span>
                        <span id="previewGastos" class="font-bold text-rose-400">RD$0.00</span>
                    </div>
                    <div>
                        <span class="text-slate-400">Ganancia Real: </span>
                        <span id="previewGanancia" class="font-bold text-emerald-400">RD$0.00</span>
                    </div>
                </div>

                <button type="submit" id="btnGuardar" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-amber-500/20 cursor-pointer">
                    Guardar Registro Diario
                </button>
            </form>
        </div>

        <!-- Historial Local -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-300 mb-3 uppercase tracking-wider">Historial Local</h2>
            <div id="historialContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-4">No hay registros guardados aún.</p>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnIMKMjSIlFoKDCmUJa330cBQynGP4EWdXh88vAoL7kUhre-f1CUj2meHsPHAVEc2byQ/exec";

        document.getElementById('fecha').valueAsDate = new Date();

        let registros = JSON.parse(localStorage.getItem('indrive_registros')) || [];

        const form = document.getElementById('registroForm');
        const mHecho = document.getElementById('montoHecho');
        const viajeInput = document.getElementById('viajeInput');
        const btnSumar = document.getElementById('btnSumarViaje');
        const btnRestar = document.getElementById('btnRestarViaje');
        const btnGuardar = document.getElementById('btnGuardar');

        const cHoy = document.getElementById('combustibleHoy');
        const rHoy = document.getElementById('recargaHoy');
        const cManana = document.getElementById('combustibleManana');
        const rManana = document.getElementById('recargaManana');
        const oGastos = document.getElementById('otrosGastos');

        const prevGastos = document.getElementById('previewGastos');
        const prevGanancia = document.getElementById('previewGanancia');

        // Cargar totales oficiales desde Google Sheets al abrir la app
        async function cargarTotalesNube() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                document.getElementById('accHecho').textContent = `RD$${Number(data.totalHecho).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                document.getElementById('accGastos').textContent = `RD$${Number(data.totalGastos).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                document.getElementById('accGanancia').textContent = `RD$${Number(data.gananciaReal).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            } catch (error) {
                console.error("Error al cargar totales de la nube:", error);
                document.getElementById('accHecho').textContent = 'Error';
                document.getElementById('accGastos').textContent = 'Error';
                document.getElementById('accGanancia').textContent = 'Error';
            }
        }

        btnSumar.addEventListener('click', () => {
            const actual = parseFloat(mHecho.value) || 0;
            const extra = parseFloat(viajeInput.value) || 0;
            mHecho.value = actual + extra;
            viajeInput.value = '';
            calcularEnVivo();
        });

        btnRestar.addEventListener('click', () => {
            const actual = parseFloat(mHecho.value) || 0;
            const menos = parseFloat(viajeInput.value) || 0;
            mHecho.value = Math.max(0, actual - menos);
            viajeInput.value = '';
            calcularEnVivo();
        });

        function calcularEnVivo() {
            const hecho = parseFloat(mHecho.value) || 0;
            const gastos = (parseFloat(cHoy.value) || 0) + 
                           (parseFloat(rHoy.value) || 0) + 
                           (parseFloat(cManana.value) || 0) + 
                           (parseFloat(rManana.value) || 0) + 
                           (parseFloat(oGastos.value) || 0);
            const ganancia = hecho - gastos;

            prevGastos.textContent = `RD$${gastos.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            prevGanancia.textContent = `RD$${ganancia.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        }

        [mHecho, cHoy, rHoy, cManana, rManana, oGastos].forEach(input => {
            input.addEventListener('input', calcularEnVivo);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fechaVal = document.getElementById('fecha').value;
            const dateObj = new Date(fechaVal + 'T00:00:00');
            const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const diaSemana = dias[dateObj.getDay()];

            const nuevoRegistro = {
                id: Date.now(),
                fecha: fechaVal.split('-').reverse().join('/'),
                diaSemana: diaSemana,
                montoHecho: parseFloat(mHecho.value) || 0,
                combustibleHoy: parseFloat(cHoy.value) || 0,
                recargaHoy: parseFloat(rHoy.value) || 0,
                combustibleManana: parseFloat(cManana.value) || 0,
                recargaManana: parseFloat(rManana.value) || 0,
                otrosGastos: parseFloat(oGastos.value) || 0,
            };

            nuevoRegistro.totalGastos = nuevoRegistro.combustibleHoy + nuevoRegistro.recargaHoy + nuevoRegistro.combustibleManana + nuevoRegistro.recargaManana + nuevoRegistro.otrosGastos;
            nuevoRegistro.gananciaReal = nuevoRegistro.montoHecho - nuevoRegistro.totalGastos;

            btnGuardar.textContent = "Enviando a Google Sheets...";
            btnGuardar.disabled = true;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoRegistro)
                });

                registros.unshift(nuevoRegistro);
                localStorage.setItem('indrive_registros', JSON.stringify(registros));

                form.reset();
                document.getElementById('fecha').valueAsDate = new Date();
                calcularEnVivo();
                renderizarApp();
                cargarTotalesNube(); // Actualizar totales desde la hoja tras guardar
                alert('¡Registro guardado y sincronizado con Google Sheets con éxito, Jefe!');

            } catch (error) {
                console.error(error);
                alert('Hubo un error al sincronizar con la nube, pero se guardó localmente.');
            } finally {
                btnGuardar.textContent = "Guardar Registro Diario";
                btnGuardar.disabled = false;
            }
        });

        function eliminarRegistro(id) {
            registros = registros.filter(r => r.id !== id);
            localStorage.setItem('indrive_registros', JSON.stringify(registros));
            renderizarApp();
        }

        function renderizarApp() {
            const container = document.getElementById('historialContainer');
            if (registros.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No hay registros guardados aún.</p>`;
                return;
            }

            container.innerHTML = '';
            registros.forEach(r => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/80 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center text-xs";
                card.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-200">${r.fecha} (${r.diaSemana})</span>
                        <div class="text-slate-400 mt-0.5">Hecho: <span class="text-emerald-400 font-semibold">RD$${r.montoHecho.toLocaleString()}</span></div>
                        <div class="text-slate-400">Gastos: <span class="text-rose-400 font-semibold">RD$${r.totalGastos.toLocaleString()}</span></div>
                    </div>
                    <div class="text-right">
                        <span class="block text-[10px] text-slate-400 uppercase">Ganancia Real</span>
                        <span class="text-sm font-bold text-amber-400">RD$${r.gananciaReal.toLocaleString()}</span>
                        <button onclick="eliminarRegistro(${r.id})" class="text-[10px] text-rose-500 hover:underline block mt-1">Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        renderizarApp();
        cargarTotalesNube(); // Cargar los totales al iniciar la app
    </script>
</body>
</html>
